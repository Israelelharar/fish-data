# GitHub switches off scheduled workflows in a public repo after 60 days without activity.
# Twice a month this (1) switches the data schedule back on, in case it was ever disabled, and
# (2) commits a tiny heartbeat file, which counts as activity and resets the 60-day clock.
# data.yml switches this workflow on in return, so each keeps the other alive.
name: keepalive
on:
  schedule:
    - cron: "41 3 1,15 * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Switch the scheduled workflows on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in data.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" && echo "enabled $wf"
          done
      - name: Heartbeat commit (repository activity)
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > data/heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heartbeat.txt
          git commit -m "keepalive heartbeat" && git push
